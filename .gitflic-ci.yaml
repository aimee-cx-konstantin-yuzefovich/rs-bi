stages:
  - build
  - deploy

build_job:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npx prisma generate
    - npm run build
  artifacts:
    paths:
      - .next/standalone/
      - .next/static/
      - public/
      - prisma/
      - package.json

deploy_job:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_job
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Копируем собранные файлы на сервер, исключая удаление .env и базы данных
    - rsync -avz --delete --exclude='.env' --exclude='db' -e "ssh -o StrictHostKeyChecking=no" .next/standalone/ root@$SERVER_IP:/var/www/www-root/data/www/bi-terminal/
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" .next/static/ root@$SERVER_IP:/var/www/www-root/data/www/bi-terminal/.next/static/
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" public/ root@$SERVER_IP:/var/www/www-root/data/www/bi-terminal/public/
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" prisma/ root@$SERVER_IP:/var/www/www-root/data/www/bi-terminal/prisma/
    # Применяем миграции БД и перезапускаем PM2
    - ssh -o StrictHostKeyChecking=no root@$SERVER_IP "cd /var/www/www-root/data/www/bi-terminal && npx prisma migrate deploy && pm2 restart bi-terminal --update-env"
  only:
    - master
    - main
