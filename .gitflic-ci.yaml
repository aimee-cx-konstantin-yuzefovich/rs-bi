stages:
  - build
  - deploy

build_job:
  stage: build
  # Host deployment targets Debian-compatible glibc/OpenSSL 3, not Alpine musl.
  image: node:20-bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl zip && rm -rf /var/lib/apt/lists/*
  script:
    # DEPLOY_ARCH must match the existing PM2 host (x64 or arm64).
    - bash build-deploy.sh
  artifacts:
    paths:
      - deploy-prod.zip

deploy_job:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_job
  before_script:
    - apk add --no-cache openssh-client rsync unzip
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Validate the artifact boundary before any destructive synchronization.
    - unzip -tq deploy-prod.zip
    - rm -rf deploy-staging && mkdir deploy-staging && unzip -q deploy-prod.zip -d deploy-staging
    - sh deploy-staging/scripts/verify-deploy-artifact.sh deploy-staging
    # Exclusions protect both legacy and current DB locations from --delete.
    - rsync -avz --delete --exclude='.env*' --exclude='db/' --exclude='*.db*' --exclude='*.sqlite*' -e ssh deploy-staging/ "root@$SERVER_IP:/var/www/www-root/data/www/bi-terminal/"
    # Uses packaged CLI and the same production .env loading as the application.
    - ssh "root@$SERVER_IP" "cd /var/www/www-root/data/www/bi-terminal && NODE_ENV=production node scripts/migrate-deploy.mjs && pm2 restart bi-terminal --update-env"
  only:
    - master
    - main
