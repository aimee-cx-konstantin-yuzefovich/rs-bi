# ──────────────────────────────────────────────────────────────────
# Nginx конфигурация: bi-terminal.rus-silica.com
# WordPress + BI Terminal на ОДНОМ домене
# ──────────────────────────────────────────────────────────────────
#
# Логика маршрутизации:
#   /wp-admin/*     → WordPress (PHP-FPM)
#   /wp-includes/*  → WordPress (статика)
#   /wp-content/*   → WordPress (статика)
#   /wp-login.php   → WordPress (PHP-FPM)
#   /wp-cron.php    → WordPress (PHP-FPM)
#   /wp-json/*      → WordPress (REST API)
#   /xmlrpc.php     → WordPress (PHP-FPM)
#   /index.php      → WordPress (PHP-FPM) — только если это WP-запрос
#   /_next/*        → BI Terminal (Node.js :3000) — статики Next.js
#   /api/*          → BI Terminal (Node.js :3000) — API-эндпоинты
#   /login          → BI Terminal (Node.js :3000) — страница входа
#   /favicon.ico    → BI Terminal (Node.js :3000)
#   Всё остальное   → BI Terminal (Node.js :3000)
#
# УСТАНОВКА через ISPManager:
#   1. ISPManager → Домены → WWW-домены → bi-terminal.rus-silica.com → Изменить
#   2. Найдите поле «Конфигурация Nginx» или «Расширенные настройки»
#   3. Замените содержимое location-блоков на конфигурацию ниже
#
# УСТАНОВКА вручную:
#   1. Скопируйте этот файл в /etc/nginx/vhosts/ПОЛЬЗОВАТЕЛЬ/bi-terminal.rus-silica.com.conf
#   2. Замените ПОЛЬЗОВАТЕЛЬ и пути на ваши
#   3. nginx -t && systemctl reload nginx
# ──────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name bi-terminal.rus-silica.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bi-terminal.rus-silica.com;

    # ─── SSL сертификаты (Let's Encrypt через ISPManager) ───
    # ISPManager автоматически создаёт эти строки.
    # Если их нет, получите сертификат: ISPManager → SSL-сертификаты → Создать
    # ssl_certificate /etc/letsencrypt/live/bi-terminal.rus-silica.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bi-terminal.rus-silica.com/privkey.pem;

    # ─── Логи ───
    access_log /var/log/nginx/bi-terminal.rus-silica.com.access.log;
    error_log /var/log/nginx/bi-terminal.rus-silica.com.error.log;

    # ─── Корневая директория WordPress ───
    root /var/www/ПОЛЬЗОВАТЕЛЬ/data/www/bi-terminal.rus-silica.com;
    index index.php index.html;

    # ═══════════════════════════════════════════════════════
    # BI TERMINAL: Next.js статики и API
    # ═══════════════════════════════════════════════════════

    # Next.js статические файлы (JS, CSS, шрифты) — с кешированием
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js изображения
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BI Terminal API-эндпоинты
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # BI Terminal страница входа
    location = /login {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Логотип и favicon BI терминала
    location = /russilica-logo.png {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # ═══════════════════════════════════════════════════════
    # WORDPRESS: PHP-файлы и директории
    # ═══════════════════════════════════════════════════════

    # wp-login.php — страница входа WordPress
    location = /wp-login.php {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # wp-cron.php — cron WordPress
    location = /wp-cron.php {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # xmlrpc.php
    location = /xmlrpc.php {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # wp-admin, wp-includes, wp-content — статики WordPress
    location ~* ^/(wp-admin|wp-includes|wp-content)/ {
        try_files $uri =404;
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }
    }

    # wp-json REST API
    location ~ ^/wp-json/ {
        try_files $uri $uri/ /index.php?q=$uri&$args;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ═══════════════════════════════════════════════════════
    # DEFAULT: BI Terminal (всё остальное → Node.js)
    # ═══════════════════════════════════════════════════════

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
