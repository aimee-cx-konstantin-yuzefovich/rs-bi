# Copy .env.example to .env and set real runtime secrets before starting.
# docker compose up -d --build; docker compose logs -f
# docker compose down preserves SQLite; never use down -v for production data.
services:
  bi-terminal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WP_LOGIN_URL: ${NEXT_PUBLIC_WP_LOGIN_URL:-https://bi-terminal.rus-silica.com/wp-login.php}
    container_name: russilica-bi-terminal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # Host reverse proxy connects here.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/db/audit.db # Must stay inside the mounted volume.
      PORT: "3000" # Keep in sync with the fixed health probe and published port.
      HOSTNAME: "0.0.0.0" # Container must listen on its interface, not loopback.
    volumes:
      - bi-data:/app/db
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.cjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  bi-data:
