name: CI & Release Gate

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository QA Verification Gate
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: build-only-not-a-runtime-secret
      PROXY_SECRET: build-only-not-a-runtime-secret
      DATABASE_URL: "file:./build-test.db"
      BITRIX_WEBHOOK_URL: ""
      NEXT_TELEMETRY_DISABLED: 1
      # Exact-SHA release provenance: /api/health must report this commit.
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run test suite (Vitest)
        run: npx vitest run

      - name: Verify Bitrix contract (Offline)
        run: npm run qa:bitrix-contract:offline

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run Next.js build
        run: npm run build

      - name: Run deployment QA suite
        run: sh scripts/qa-deployment.sh

  # This job does NOT deploy production. It only confirms that release
  # verification succeeded and the standalone artifact is eligible for the
  # EXTERNAL deployment process documented in DEPLOYMENT.md.
  # A successful eligibility gate MUST NOT be called a production deployment.
  eligibility:
    name: Standalone Release Eligibility Gate
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Record release eligibility
        run: |
          echo "Release verification passed for exact SHA: ${{ github.sha }}."
          echo "Artifact is ELIGIBLE for external production deployment."
          echo "EXTERNAL DEPLOYMENT REQUIRED (see DEPLOYMENT.md)."
          echo ""
          echo "After external deployment, the release authority MUST verify:"
          echo "  1. GET /api/health returns buildSha == ${{ github.sha }}"
          echo "  2. Routes / /companies /samples /commercial-funnel exist (never 404;"
          echo "     protected pages may redirect to /login)"
          echo "  3. /api/bitrix/deals, /api/bitrix/companies/list, /api/bitrix/samples,"
          echo "     /api/bitrix/commercial-funnel respond with auth boundaries (401/403),"
          echo "     never 404, when unauthenticated"
          echo "  4. Login flow works (WordPress SSO)"
