name: CI & Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository QA Verification Gate
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: build-only-not-a-runtime-secret
      PROXY_SECRET: build-only-not-a-runtime-secret
      DATABASE_URL: "file:./build-test.db"
      BITRIX_WEBHOOK_URL: ""
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run test suite (Vitest)
        run: npx vitest run

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run Next.js build
        run: npm run build

      - name: Run deployment QA suite
        run: sh scripts/qa-deployment.sh

  deploy:
    name: Standalone Package & Deploy Gate
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify pipeline gate passed
        run: echo "Verification gate passed. Proceeding with release deployment pipeline."
